<svg xmlns="http://www.w3.org/2000/svg" width="760" height="256" viewBox="0 0 760 256" fill="none">
  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.45" />
    </linearGradient>
    <clipPath id="termClip">
      <rect x="1" y="1" width="758" height="254" rx="14" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, ui-monospace, monospace; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor {
      animation: blink 1.05s step-end infinite;
    }
  </style>

  <g clip-path="url(#termClip)">
    <!-- Terminal Body -->
    <rect x="1" y="1" width="758" height="254" rx="14" fill="#11131e" />

    <!-- Header Bar -->
    <rect x="1" y="1" width="758" height="38" fill="#1a1b27" />
    <line x1="1" y1="39" x2="759" y2="39" stroke="#2d3142" stroke-width="1" />
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="758" height="254" rx="14" stroke="url(#termBorder)" stroke-width="1.2" />

  <!-- macOS Traffic Lights -->
  <circle cx="24" cy="20" r="5.5" fill="#ff5f56" />
  <circle cx="44" cy="20" r="5.5" fill="#ffbd2e" />
  <circle cx="64" cy="20" r="5.5" fill="#27c93f" />

  <!-- Window Title -->
  <text x="380" y="24" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8">
    shijn@arch: ~/workspace — zsh
  </text>

  <!-- Prompt 1 -->
  <text x="26" y="70" class="mono" font-size="13.2">
    <tspan fill="#a855f7" font-weight="700">$</tspan>
    <tspan fill="#e2e8f0"> whoami</tspan>
  </text>
  <text x="26" y="92" class="mono" font-size="13.2">
    <tspan fill="#06b6d4">→</tspan>
    <tspan fill="#f8fafc" font-weight="600"> Phước Toàn (Shiin)</tspan>
    <tspan fill="#64748b"> — </tspan>
    <tspan fill="#bf91f3">@0xshijn</tspan>
    <tspan fill="#64748b"> · Nha Trang, VN</tspan>
  </text>

  <!-- Prompt 2 -->
  <text x="26" y="122" class="mono" font-size="13.2">
    <tspan fill="#a855f7" font-weight="700">$</tspan>
    <tspan fill="#e2e8f0"> cat ./focus.txt</tspan>
  </text>
  <text x="26" y="144" class="mono" font-size="13.2">
    <tspan fill="#06b6d4">→</tspan>
    <tspan fill="#cbd5e1"> Binary Exploitation (Pwn) · Web Security · Reverse Engineering</tspan>
  </text>

  <!-- Prompt 3 -->
  <text x="26" y="174" class="mono" font-size="13.2">
    <tspan fill="#a855f7" font-weight="700">$</tspan>
    <tspan fill="#e2e8f0"> cat ./roadmap_2026.txt</tspan>
  </text>
  <text x="26" y="196" class="mono" font-size="13.2">
    <tspan fill="#06b6d4">→</tspan>
    <tspan fill="#70a5fd"> Linux Kernel Exploitation</tspan>
    <tspan fill="#94a3b8"> (heap grooming, KASLR)</tspan>
    <tspan fill="#64748b"> | </tspan>
    <tspan fill="#22c55e" font-weight="600">Target: OSCP</tspan>
  </text>

  <!-- Prompt 4 -->
  <text x="26" y="226" class="mono" font-size="13.2">
    <tspan fill="#a855f7" font-weight="700">$</tspan>
    <tspan fill="#cbd5e1"> echo "Nói ít làm nhiều — build fast, break assumptions." </tspan>
    <tspan fill="#06b6d4" class="cursor">█</tspan>
  </text>
</svg>
