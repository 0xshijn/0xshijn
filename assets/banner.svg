<svg xmlns="http://www.w3.org/2000/svg" width="880" height="235" viewBox="0 0 880 235" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a11" />
      <stop offset="50%" stop-color="#101321" />
      <stop offset="100%" stop-color="#1a1b27" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#70a5fd" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.78" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#70a5fd" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="65%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <pattern id="cyberGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#70a5fd" fill-opacity="0.14" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="878" height="233" rx="18" />
    </clipPath>

    <clipPath id="barClip">
      <rect x="150" y="180" width="580" height="3" rx="1.5" />
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, ui-monospace, monospace; }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.84); }
    }
    @keyframes scanSlide {
      0% { transform: translateX(-290px); }
      50% { transform: translateX(290px); }
      100% { transform: translateX(-290px); }
    }
    @keyframes floatGlow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .dot-live {
      transform-origin: 48px 39px;
      animation: pulseDot 2.1s ease-in-out infinite;
    }
    .scan-bar {
      animation: scanSlide 5.2s ease-in-out infinite;
    }
    .glow-orb {
      animation: floatGlow 6s ease-in-out infinite;
    }
  </style>

  <!-- Card Background & Grid -->
  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="878" height="233" rx="18" fill="url(#bgGrad)" />
    <rect x="1" y="1" width="878" height="233" fill="url(#cyberGrid)" />

    <!-- Ambient Glow Orbs -->
    <circle cx="145" cy="36" r="195" fill="url(#orbPurple)" class="glow-orb" />
    <circle cx="745" cy="200" r="215" fill="url(#orbCyan)" class="glow-orb" />
  </g>

  <!-- Corner HUD Reticles -->
  <path d="M 16 32 L 16 18 Q 16 14 20 14 L 34 14" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 864 32 L 864 18 Q 864 14 860 14 L 846 14" stroke="#06b6d4" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 16 203 L 16 217 Q 16 221 20 221 L 34 221" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 864 203 L 864 217 Q 864 221 860 221 L 846 221" stroke="#06b6d4" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round" />

  <!-- Subtle Background Register Watermarks -->
  <text x="34" y="196" class="mono" font-size="10" fill="#64748b" fill-opacity="0.45">0x7fffffffde20</text>
  <text x="846" y="196" text-anchor="end" class="mono" font-size="10" fill="#64748b" fill-opacity="0.45">NX · ASLR · PIE</text>

  <!-- Crisp Outer Border -->
  <rect x="1" y="1" width="878" height="233" rx="18" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Left Status Pill -->
  <rect x="30" y="25" width="232" height="28" rx="14" fill="#161928" fill-opacity="0.92" stroke="#2d324b" stroke-width="1" />
  <circle cx="48" cy="39" r="6" fill="#22c55e" fill-opacity="0.22" />
  <circle cx="48" cy="39" r="3.8" fill="#22c55e" class="dot-live" />
  <text x="62" y="43" class="mono" font-size="11.2" font-weight="600" fill="#cbd5e1">ONLINE · NHA TRANG, VN</text>

  <!-- Top Right Focus Pill -->
  <rect x="630" y="25" width="220" height="28" rx="14" fill="#161928" fill-opacity="0.92" stroke="#2d324b" stroke-width="1" />
  <text x="740" y="43" text-anchor="middle" class="mono" font-size="11.2" font-weight="600" fill="#70a5fd">PWN · KERNEL · WEB · RE</text>

  <!-- Hero Title -->
  <text x="440" y="116" text-anchor="middle" class="sans" font-size="43" font-weight="800" letter-spacing="-0.6">
    <tspan fill="#f8fafc">Phước Toàn</tspan>
    <tspan fill="#475569"> // </tspan>
    <tspan fill="url(#titleGrad)" class="mono">0xshijn</tspan>
  </text>

  <!-- Hero Subtitle -->
  <text x="440" y="149" text-anchor="middle" class="mono" font-size="14" font-weight="500" fill="#cbd5e1" letter-spacing="0.3">
    Binary Exploitation  ·  Kernel Heap &amp; KASLR  ·  OSCP 2026
  </text>

  <!-- Animated Gradient Scanner Bar -->
  <rect x="150" y="180" width="580" height="3" rx="1.5" fill="#222639" />
  <g clip-path="url(#barClip)">
    <rect x="330" y="180" width="220" height="3" rx="1.5" fill="url(#barGrad)" class="scan-bar" />
  </g>

  <!-- Bottom Pwn Ethos -->
  <text x="440" y="210" text-anchor="middle" class="mono" font-size="11.8" fill="#94a3b8">
    $ read assembly · corrupt state · control RIP
  </text>
</svg>
